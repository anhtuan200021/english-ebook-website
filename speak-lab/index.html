/* Editable practice content. All practice scenarios focus on everyday present-simple speech. */

const LESSONS = [
  {id:'morning', emoji:'🌤️', title:'Morning routine', vi:'Buổi sáng của tôi', desc:'Thức dậy, bắt đầu ngày mới, kể về thói quen', turns:[
    {q:'What do you usually do after you wake up?', vi:'Bạn thường làm gì sau khi thức dậy?', note:'Có thể chọn một việc hôm nay, rồi đổi sang việc khác ở lần luyện tiếp theo.', options:[
      O('Go to the bathroom','Đi vệ sinh','I go to the bathroom.','I usually go to the bathroom first.','I go straight to the bathroom.','The first thing I do is go to the bathroom.','I get up and head to the bathroom.'),

    {q:'What do you usually do next?', vi:'Sau đó bạn thường làm gì?', options:[
      O('Wash my hands','Rửa tay','Then I wash my hands.','I wash my hands after that.','I usually wash my hands next.','The next thing I do is wash my hands.'),

      O('Have breakfast','Ăn sáng','I have breakfast.','Then I eat breakfast.','I usually get something to eat.','I go to the kitchen and have breakfast.'),

      O('The quiet','Sự yên tĩnh','I like how quiet it is.','I really like quiet mornings.','I enjoy the peace and quiet.','I like having a little quiet time.'),

<script>
(() => {
'use strict';
const STORAGE_KEY='tuanbong-speaklab-v1';
const DEFAULT={progress:{},history:[],saved:[],lastTopic:'morning'};
let state=loadState();
let view='practice', topic=LESSONS.some(l=>l.id===state.lastTopic)?state.lastTopic:'morning';
let chosenA=0,chosenB=0,pinnedParts=[],selectedAction=null,searchTerm='',groupFilter='all',recording=false;
let currentRecorder=null,recordedChunks=[],audioObjectURL=null,recognition=null,listening=false;
let toastTimer=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function loadState(){try{const value=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');if(value&&typeof value==='object')return {...DEFAULT,...value,progress:value.progress||{},history:Array.isArray(value.history)?value.history:[],saved:Array.isArray(value.saved)?value.saved:[]};}catch(e){}return structuredClone(DEFAULT);}
function store(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}catch(e){toast('Trình duyệt không cho phép lưu dữ liệu tại đây. Hãy thử mở bằng trang HTTPS.');}}
function tell(s){toast(s)}
function toast(s){const root=$('toast-root');if(!root)return;root.innerHTML=`<div class="toast" role="status">${esc(s)}</div>`;clearTimeout(toastTimer);toastTimer=setTimeout(()=>root.innerHTML='',3500)}
function getLesson(){return LESSONS.find(l=>l.id===topic)||LESSONS[0];}
function progressOf(l){let n=Number(state.progress[l.id]||0);return Math.max(0,Math.min(n,l.turns.length));}
function completed(){return state.history.length}
function practicedDays(){return [...new Set(state.history.map(h=>(h.at||'').slice(0,10)))].length}
function localDay(d){const yr=d.getFullYear(),mo=String(d.getMonth()+1).padStart(2,'0'),dy=String(d.getDate()).padStart(2,'0');return `${yr}-${mo}-${dy}`}
function streak(){let days=new Set(state.history.map(h=>h.day||localDay(new Date(h.at))));if(!days.size)return 0;let d=new Date(),count=0;if(!days.has(localDay(d)))d.setDate(d.getDate()-1);while(days.has(localDay(d))){count++;d.setDate(d.getDate()-1)}return count;}
function nav(){const navs=[['practice','💬','Luyện hội thoại'],['actions','📚','100 hành động'],['saved','⭐','Câu đã lưu'],['progress','📈','Tiến độ']];return navs.map(([v,emoji,label])=>`<button type="button" class="nav-btn ${view===v?'active':''}" data-action="nav" data-view="${v}" aria-current="${view===v?'page':'false'}"><span class="nav-emoji">${emoji}</span>${label}<span class="nav-count">${v==='saved'?state.saved.length:v==='actions'?100:v==='practice'?LESSONS.length:''}</span></button>`).join('')}
function hero(){return `<section class="hero"><div class="hero-main"><div class="hero-eyebrow">REAL · SIMPLE · NATURAL</div><h2>Biết từ rồi.<br>Giờ dùng được từ.</h2><p>Chọn ý bạn muốn nói (A). Khám phá nhiều cách nói tự nhiên (B). Sau đó tự nói theo cách của bạn, không cần thuộc lòng.</p></div><div class="hero-emoji" aria-hidden="true"><img class="tb-mascot " src="../assets/mascots/learning.webp" width="360" height="360" alt="" aria-hidden="true" loading="lazy" decoding="async"></div></section>`}
function stats(){return `<div class="stats"><div class="stat"><div class="stat-icon">🎙️</div><div><strong>${completed()}</strong><small>Lượt trả lời</small></div></div><div class="stat"><div class="stat-icon">⭐</div><div><strong>${state.saved.length}</strong><small>Câu yêu thích</small></div></div><div class="stat"><div class="stat-icon">🔥</div><div><strong>${streak()}</strong><small>Ngày liên tiếp</small></div></div></div>`}
function topics(){return `<div class="lesson-strip" role="group" aria-label="Chủ đề luyện nói">${LESSONS.map(l=>`<button type="button" class="topic-chip ${topic===l.id?'selected':''}" data-action="topic" data-topic="${l.id}">${l.emoji} ${esc(l.vi)} ${progressOf(l)===l.turns.length?'✓':''}</button>`).join('')}</div>`}
function renderPractice(){const l=getLesson(),index=progressOf(l);let s=hero()+stats()+`<div class="section-heading"><div><h3>🎯 Luyện hội thoại</h3><p>Hội thoại đời thường, mỗi câu có hai bộ gợi ý A và B.</p></div><span class="secondary-tag">${LESSONS.length} chủ đề</span></div>`+topics();
if(index>=l.turns.length){s+=`<div class="done-card"><div class="done-emoji">🎉</div><h3>Hoàn thành ${esc(l.vi)}!</h3><p>Bạn đã luyện ${l.turns.length} câu hỏi trong chủ đề này. Quay lại luyện thêm các ý khác, hoặc sang chủ đề tiếp theo. Một câu hỏi có nhiều câu trả lời đúng.</p><div class="actions"><button class="btn btn-primary" data-action="restart">↻ Luyện lại chủ đề</button><button class="btn" data-action="next-topic">Chủ đề tiếp theo →</button></div></div>`;return s;}
const turn=l.turns[index],a=turn.options[Math.min(chosenA,turn.options.length-1)],variant=a.variants[Math.min(chosenB,a.variants.length-1)];
let last=state.history.find(h=>h.topic===topic&&h.step===index-1);
s+=`<div class="side-by-side"><article class="lesson-card"><div class="lesson-meta"><strong>${l.emoji} ${esc(l.title)}</strong><span>Câu ${index+1}/${l.turns.length}</span></div><div class="progress-bar" role="progressbar" aria-label="Tiến độ chủ đề" aria-valuemin="0" aria-valuemax="${l.turns.length}" aria-valuenow="${index}"><span style="width:${Math.round(index/l.turns.length*100)}%"></span></div>`;
if(last)s+=`<div class="previous-answer"><div><small>YOUR LAST ANSWER</small>${esc(last.text)}</div><span aria-hidden="true">✓</span></div>`;
s+=`<div class="chat-question"><div class="bot-avatar">🤝</div><div class="bubble"><div class="bubble-label">YOUR SPEAKING PARTNER</div><h3>${esc(turn.q)}</h3><div class="translation">${esc(turn.vi)}</div><button type="button" class="tiny-action" data-action="speak-question">🔊 Nghe câu hỏi · giọng Anh-Mỹ</button></div></div><p class="micro-note">${esc(turn.note||'Hãy chọn điều đúng với bạn. Ngày khác, bạn có thể chọn một phương án khác.')}</p>`;
s+=`<div class="choice-head"><div><h4><span class="letter">A</span> WHAT TO SAY</h4><p>Chọn ý tưởng phù hợp với cuộc sống hôm nay.</p></div><span class="secondary-tag">${turn.options.length} ý tưởng</span></div><div class="choices-grid">`;
turn.options.forEach((o,i)=>{s+=`<button type="button" class="choice-card ${chosenA===i?'selected':''}" data-action="choose-a" data-i="${i}" aria-pressed="${chosenA===i}"><strong>${esc(o.name)}</strong><span class="vi">${esc(o.vi)}</span><span class="pick-dot" aria-hidden="true"></span></button>`});s+='</div>';
s+=`<div class="choice-head"><div><h4><span class="letter">B</span> HOW TO SAY IT</h4><p>Một ý, nhiều cách diễn đạt tự nhiên. Chú ý sự khác biệt nhỏ giữa các câu.</p></div><span class="secondary-tag">${a.variants.length} cách nói</span></div><div class="variant-list">`;
a.variants.forEach((v,i)=>{s+=`<div class="variant-card ${chosenB===i?'selected':''}"><span class="variant-radio" aria-hidden="true"></span><button type="button" data-action="choose-b" data-i="${i}" class="variant-text" style="border:0;background:none;text-align:left;padding:0" aria-pressed="${chosenB===i}">${esc(v)}</button><div class="variant-buttons"><button type="button" class="icon-button" data-action="listen-variant" data-i="${i}" aria-label="Nghe câu số ${i+1}" title="Nghe">♫</button><button type="button" class="icon-button ${state.saved.includes(v)?'saved':''}" data-action="save-variant" data-i="${i}" aria-label="Lưu câu số ${i+1}" title="Lưu câu">${state.saved.includes(v)?'★':'☆'}</button></div></div>`});s+='</div>';
s+=`<div class="composer"><h4>🎤 Your turn!</h4><p>Đọc ý bằng tiếng Anh, tự thay đổi hoặc kết hợp thêm câu khác. Micro sẽ điền lời nói vào ô này nếu trình duyệt hỗ trợ.</p><textarea id="answer" spellcheck="false" aria-label="Câu trả lời tiếng Anh của bạn">${esc(pinnedParts.length?[...pinnedParts,variant].filter((v,i,arr)=>arr.indexOf(v)===i).join(' '):variant)}</textarea><div class="composer-buttons"><button class="btn btn-soft" data-action="append">📌 Giữ ý này, chọn ý khác</button><button class="btn" data-action="speak-answer">🔊 Nghe câu</button><button class="btn" data-action="recognize" id="mic-btn">🎤 Nói thành chữ</button><button class="btn" data-action="record" id="record-btn">⏺ Ghi âm</button><button class="btn" data-action="copy-answer">⧉ Sao chép</button></div><audio controls class="rec-player hidden" id="record-player"></audio><div class="status-line" id="voice-status">${(window.SpeechRecognition||window.webkitSpeechRecognition)?'Bạn có thể nói hoặc tự nhập câu.':'Nhận dạng giọng nói chưa được hỗ trợ trong trình duyệt này. Bạn vẫn có thể luyện nói thành tiếng và nhập câu.'}</div></div>`;
s+=`<div class="submit-row"><span class="detail-note">Chưa chấm phát âm. Ưu tiên nhớ từ và diễn đạt tự nhiên.</span><button class="btn btn-primary" data-action="submit" id="submit-btn">Đã nói xong · Tiếp tục →</button></div></article><aside class="learning-tip"><div class="kicker">HOW TO PRACTICE</div><h4>🌱 Chọn · Nói · Biến đổi</h4><p>Mục tiêu không phải thuộc lòng mọi câu. Chọn một cách nói phù hợp, sau đó tự đổi một vài từ để tạo câu của bạn.</p><ul><li>Chọn ý khác ở A trong lần luyện sau</li><li>Nghe thử 2–3 cách nói ở B</li><li>Nói thành tiếng trước khi bấm tiếp</li><li>Thêm câu khác để nói lâu hơn</li><li>★ Lưu những cụm muốn ôn lại</li></ul><p><strong>Ví dụ:</strong><br>“I wash my face.”<br>→ “I usually wash my face first.”</p></aside></div>`;
return s;}
function renderActions(){let s=hero()+`<div class="section-heading" style="margin-top:24px"><div><h3>📚 100 hành động hằng ngày</h3><p>Chọn một hành động, rồi thử xây nhiều câu với những từ bạn đã biết.</p></div><span class="secondary-tag">100 actions</span></div><div class="toolbar"><input id="action-search" class="search-box" type="search" placeholder="Tìm bằng English hoặc tiếng Việt..." value="${esc(searchTerm)}" aria-label="Tìm hành động"><select id="group-filter" class="search-box" aria-label="Lọc nhóm hành động"><option value="all">Tất cả 10 nhóm</option>${ACTION_GROUPS.map((g,i)=>`<option value="${i}" ${String(i)===groupFilter?'selected':''}>${g[0]} ${esc(g[1])}</option>`).join('')}</select></div><div id="action-focus"></div><div id="action-results"></div>`;return s;}
function actionVariants(a){let phrase=a.en;let secondPerson=phrase.replace(/\bmy\b/g,'your').replace(/\bme\b/g,'you');return [`I usually ${phrase}.`,`Sometimes I ${phrase}.`,`I like to ${phrase}.`,`I don’t always ${phrase}.`,`Do you usually ${secondPerson}?`];}
function paintActionResults(){let list=ACTIONS.filter(a=>(groupFilter==='all'||a.groupIndex===Number(groupFilter))&&(`${a.en} ${a.vi} ${a.group}`).toLocaleLowerCase().includes(searchTerm.toLocaleLowerCase()));let out=`<p class="detail-note">Hiển thị ${list.length} hành động. Bấm vào một hành động để xem cách luyện.</p><div class="action-grid">`+list.map(a=>`<button class="action-item" data-action="open-action" data-id="${a.id}"><span class="num">${String(a.id).padStart(2,'0')} · ${a.emoji}</span><strong>${esc(a.en)}</strong><small>${esc(a.vi)}</small></button>`).join('')+'</div>';if(!list.length)out='<div class="empty"><div class="emo">🔎</div><strong>Không tìm thấy hành động</strong><p>Hãy thử từ khóa khác nhé.</p></div>';$('action-results').innerHTML=out;paintActionFocus()}
function paintActionFocus(){const el=$('action-focus');if(!el)return;const a=ACTIONS.find(x=>x.id===selectedAction);if(!a){el.innerHTML='';return;}el.innerHTML=`<section class="action-detail"><div class="kicker">ACTION #${String(a.id).padStart(2,'0')} · ${esc(a.group)}</div><h3>${esc(a.en)}</h3><p>${esc(a.vi)} · Luyện một hành động bằng nhiều ý định và góc nhìn. Các câu dưới đây KHÔNG hoàn toàn đồng nghĩa.</p><div class="chips">${actionVariants(a).map((v,i)=>`<button type="button" class="chip" data-action="say-action" data-id="${a.id}" data-i="${i}">🔊 ${esc(v)}</button>`).join('')}</div><div class="composer-buttons"><button class="btn btn-soft" data-action="save-action" data-id="${a.id}">☆ Lưu các câu này</button><button class="btn" data-action="close-action">Đóng</button></div></section>`;}
function renderSaved(){let s=hero()+`<div class="section-heading" style="margin-top:25px"><div><h3>⭐ Câu và cụm từ đã lưu</h3><p>Nghe, nói lại và dùng những câu này trong hoàn cảnh mới.</p></div><span class="secondary-tag">${state.saved.length} câu</span></div>`;if(!state.saved.length)return s+`<div class="empty"><div class="emo">⭐</div><strong>Chưa có câu yêu thích</strong><p>Trong lúc luyện hội thoại, bấm ☆ cạnh câu bạn muốn nghe và dùng lại.</p><button class="btn btn-primary" data-action="nav" data-view="practice">Bắt đầu luyện →</button></div>`;return s+`<div class="favorites-grid">${state.saved.map((x,i)=>`<article class="fav-card"><strong>${esc(x)}</strong><p>Hãy nói câu này bằng giọng của mình, rồi thử đổi một từ.</p><div class="buttons"><button class="btn" data-action="speak-favorite" data-i="${i}">🔊 Nghe</button><button class="btn" data-action="copy-favorite" data-i="${i}">⧉ Sao chép</button><button class="btn btn-danger" data-action="remove-favorite" data-i="${i}">Bỏ lưu</button></div></article>`).join('')}</div>`;}
function renderProgress(){let counts=LESSONS.map(l=>({name:l.vi,done:progressOf(l),total:l.turns.length,emoji:l.emoji}));let s=hero()+stats()+`<div class="section-heading"><div><h3>📈 Tiến độ luyện tập</h3><p>Chỉ tính lượt bạn chủ động gửi câu, không phải điểm kiểm tra năng lực.</p></div></div><div class="panel" style="margin-bottom:16px"><h3>Tiến độ từng chủ đề</h3>${counts.map(c=>`<div style="margin-top:17px"><div class="lesson-meta"><strong>${c.emoji} ${esc(c.name)}</strong><span>${c.done}/${c.total} câu</span></div><div class="progress-bar"><span style="width:${Math.round(100*c.done/c.total)}%"></span></div></div>`).join('')}</div><div class="panel"><h3>Lịch sử gần đây</h3>${state.history.length?'<div class="history-list">'+state.history.slice(-12).reverse().map(x=>`<div class="history-item"><span>${esc(x.topicName||x.topic)} · ${new Date(x.at).toLocaleString('vi-VN')}</span><p>${esc(x.text)}</p></div>`).join('')+'</div>':'<p>Bạn chưa gửi câu nào. Hãy bắt đầu với bài nói đầu tiên nhé.</p>'}<div class="composer-buttons"><button class="btn" data-action="export">⬇ Xuất dữ liệu</button><button class="btn" data-action="import">⬆ Nhập dữ liệu</button><button class="btn btn-danger" data-action="reset">Xóa tiến độ</button><input id="import-json" type="file" accept="application/json,.json" hidden></div><p class="detail-note">Dữ liệu ở trong trình duyệt của thiết bị này. Xuất file JSON để tự sao lưu trước khi xóa dữ liệu trình duyệt hoặc đổi máy.</p></div>`;return s;}
function render(){if(listening&&recognition){try{recognition.stop()}catch(e){}listening=false}stopRecorderForChange();$('main-nav').innerHTML=nav();$('main-content').innerHTML=view==='practice'?renderPractice():view==='actions'?renderActions():view==='saved'?renderSaved():renderProgress();if(view==='actions')paintActionResults();if(view==='practice')$('submit-btn')?.addEventListener('keydown',e=>{});}
function changeView(v){view=v;selectedAction=null;pinnedParts=[];render();window.scrollTo({top:0,behavior:'instant'});}
function changeTopic(id){topic=id;chosenA=0;chosenB=0;pinnedParts=[];state.lastTopic=id;store();render()}
function currentVariant(i){let l=getLesson(),turn=l.turns[progressOf(l)],a=turn?.options[chosenA];return a?.variants[i??chosenB]||''}
function chooseA(i){chosenA=i;chosenB=0;render();}
function chooseB(i){chosenB=i;const cards=document.querySelectorAll('.variant-card');cards.forEach((c,n)=>{c.classList.toggle('selected',n===i);c.querySelector('[data-action="choose-b"]').setAttribute('aria-pressed',String(n===i))});$('answer').value=[...pinnedParts,currentVariant()].filter((v,i,a)=>a.indexOf(v)===i).join(' ');}
function speak(s){if(!('speechSynthesis' in window)){toast('Trình duyệt hiện không hỗ trợ đọc văn bản.');return;}try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(s);u.lang='en-US';u.rate=.88;u.pitch=1;const vs=speechSynthesis.getVoices();const american=vs.find(v=>/^en-US/i.test(v.lang));if(american)u.voice=american;speechSynthesis.speak(u);}catch(e){toast('Không thể phát giọng đọc trên trình duyệt này.')}}
async function copy(s){try{await navigator.clipboard.writeText(s);toast('Đã sao chép!')}catch(e){const area=document.createElement('textarea');area.value=s;document.body.appendChild(area);area.select();let ok=document.execCommand('copy');area.remove();toast(ok?'Đã sao chép!':'Không thể sao chép tự động. Bạn có thể chọn và sao chép bằng tay.')}}
function savePhrase(s){if(state.saved.includes(s)){state.saved=state.saved.filter(v=>v!==s);toast('Đã bỏ lưu câu.')}else{state.saved.unshift(s);toast('Đã lưu vào bộ ôn tập ⭐')}store()}
function chooseAndSpeak(){const text=$('answer')?.value.trim();if(text)speak(text);else toast('Hãy nhập một câu để nghe mẫu nhé.')}
function updateVoiceStatus(s){const el=$('voice-status');if(el)el.textContent=s;}
function recognize(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){toast('Trình duyệt chưa hỗ trợ chuyển giọng nói thành chữ. Hãy dùng ô nhập hoặc chức năng ghi âm.');return;}if(listening&&recognition){recognition.stop();return;}try{recognition=new SR();recognition.lang='en-US';recognition.interimResults=false;recognition.continuous=false;recognition.maxAlternatives=1;recognition.onstart=()=>{listening=true;updateVoiceStatus('🎙️ Đang nghe… Hãy nói tiếng Anh.');const b=$('mic-btn');if(b)b.textContent='⏹ Dừng nghe';};recognition.onresult=e=>{const heard=Array.from(e.results).map(r=>r[0]?.transcript||'').join(' ').trim();const area=$('answer');if(area&&heard)area.value=heard;updateVoiceStatus(heard?'Đã ghi nhận lời nói. Bạn có thể chỉnh lại câu trước khi tiếp tục.':'Không nghe rõ. Hãy thử lại.');};recognition.onerror=e=>{updateVoiceStatus('Không thể nhận dạng giọng nói ('+e.error+'). Hãy thử nhập câu hoặc dùng ghi âm.');};recognition.onend=()=>{listening=false;const b=$('mic-btn');if(b)b.textContent='🎤 Nói thành chữ';};recognition.start();}catch(e){toast('Không thể bật micro. Hãy kiểm tra quyền truy cập và thử trên HTTPS.')}}
function stopRecorderForChange(){if(currentRecorder&&recording){try{currentRecorder.stop();}catch(e){}recording=false;}if(audioObjectURL){URL.revokeObjectURL(audioObjectURL);audioObjectURL=null}}
async function toggleRecord(){if(recording&&currentRecorder){try{currentRecorder.stop();}catch(e){}recording=false;const b=$('record-btn');if(b)b.textContent='⏺ Ghi âm';return;}if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){toast('Ghi âm không hỗ trợ tại đây. Thử mở qua HTTPS/localhost hoặc dùng thiết bị khác.');return;}try{let stream=await navigator.mediaDevices.getUserMedia({audio:true});recordedChunks=[];currentRecorder=new MediaRecorder(stream);currentRecorder.ondataavailable=e=>{if(e.data.size)recordedChunks.push(e.data)};currentRecorder.onstop=()=>{stream.getTracks().forEach(t=>t.stop());if(!recordedChunks.length)return;const blob=new Blob(recordedChunks,{type:currentRecorder.mimeType||'audio/webm'});if(audioObjectURL)URL.revokeObjectURL(audioObjectURL);audioObjectURL=URL.createObjectURL(blob);const el=$('record-player');if(el){el.src=audioObjectURL;el.classList.remove('hidden');}updateVoiceStatus('Bản ghi chỉ được giữ trong phiên này. Bấm phát để nghe lại giọng mình.');};currentRecorder.start();recording=true;const b=$('record-btn');if(b)b.textContent='⏹ Dừng ghi âm';updateVoiceStatus('⏺ Đang ghi âm. Bấm Dừng ghi âm khi bạn nói xong.')}catch(e){toast('Không thể truy cập micro. Hãy cấp quyền hoặc thử mở trang bằng HTTPS.')}}
function submit(){let text=$('answer')?.value?.trim();if(!text){toast('Bạn hãy nói hoặc nhập ít nhất một câu trước nhé.');$('answer')?.focus();return;}const l=getLesson(),i=progressOf(l);state.history.push({at:new Date().toISOString(),day:localDay(new Date()),topic:l.id,topicName:l.vi,step:i,text});state.history=state.history.slice(-500);state.progress[l.id]=Math.min(i+1,l.turns.length);store();chosenA=0;chosenB=0;pinnedParts=[];render();const el=$('.lesson-card');if(el)el.scrollIntoView({behavior:'smooth',block:'start'});else window.scrollTo({top:220,behavior:'smooth'});}
function showHelp(){const el=$('modal-root');el.innerHTML=`<div class="modal-backdrop" role="presentation"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="help-title"><h3 id="help-title">🌱 Cách sử dụng Speak Lab</h3><p><strong>1. OPTION A:</strong> Chọn một ý bạn có thể nói trong đời thực. Hôm nay và ngày mai có thể chọn khác nhau.</p><p><strong>2. OPTION B:</strong> Chọn một trong những cách diễn đạt. Bấm ♫ để nghe câu, ☆ để lưu từ/cụm mình thích.</p><p><strong>3. YOUR TURN:</strong> Sửa câu cho đúng trải nghiệm của bạn. Nói thành tiếng, dùng nút 🎤 khi trình duyệt hỗ trợ, hoặc bấm ⏺ để ghi âm rồi tự nghe lại.</p><p><strong>4. TIẾP TỤC:</strong> Bấm “Đã nói xong” để sang câu hỏi kế tiếp. Đây là bộ hội thoại dựng sẵn, không phải chatbot AI tự nhận xét câu trả lời.</p><p><strong>Riêng tư và miễn phí:</strong> Trang này không cần đăng nhập hay API trả phí. Câu trả lời và tiến độ lưu trong trình duyệt máy bạn. Tính năng chuyển giọng nói thành chữ, nếu dùng, có thể gửi âm thanh đến nhà cung cấp dịch vụ nhận dạng của trình duyệt và thường cần Internet. Ghi âm chỉ được giữ tạm trong phiên.</p><p><strong>Oxford 3000:</strong> Ưu tiên từ vựng cơ bản; vẫn có vài từ đời sống cần thiết như podcast, motorbike, package. Chưa kiểm tra tự động 100% câu theo danh sách.</p><div class="buttons"><button class="btn btn-primary" data-action="close-help">Mình hiểu rồi ✓</button></div></div></div>`;}
function exportData(){const blob=new Blob([JSON.stringify({version:1,...state},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='tuanbong-speaklab-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000);toast('Đã tạo bản sao lưu dữ liệu của bạn.');}
async function importData(file){if(!file)return;try{const data=JSON.parse(await file.text());if(!data||!Array.isArray(data.history)||!Array.isArray(data.saved)||typeof data.progress!=='object'||data.progress===null)throw new Error('format');if(!confirm('Nhập dữ liệu sẽ thay thế tiến độ đang lưu trong trình duyệt này. Tiếp tục?'))return;state={...DEFAULT,history:data.history.filter(x=>x&&typeof x.text==='string').slice(-500),saved:data.saved.filter(x=>typeof x==='string').slice(0,2000),progress:data.progress,lastTopic:LESSONS.some(l=>l.id===data.lastTopic)?data.lastTopic:'morning'};store();render();toast('Đã nhập dữ liệu thành công.')}catch(e){toast('Không đọc được bản sao lưu. Vui lòng chọn đúng file JSON đã xuất.')}}
function handleClick(e){const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;switch(a){case 'help':showHelp();break;case 'close-help':$('modal-root').innerHTML='';break;case 'nav':changeView(b.dataset.view);break;case 'topic':changeTopic(b.dataset.topic);break;case 'choose-a':chooseA(Number(b.dataset.i));break;case 'choose-b':chooseB(Number(b.dataset.i));break;case 'listen-variant':speak(currentVariant(Number(b.dataset.i)));break;case 'save-variant':{const v=currentVariant(Number(b.dataset.i));savePhrase(v);b.textContent=state.saved.includes(v)?'★':'☆';b.classList.toggle('saved',state.saved.includes(v));break}case 'speak-question':{const l=getLesson();speak(l.turns[progressOf(l)]?.q||'');break}case 'append':{const t=$('answer');const x=currentVariant();if(!pinnedParts.includes(x)){pinnedParts.push(x);if(t){t.value=pinnedParts.join(' ');t.focus()}toast('Đã giữ ý này. Hãy chọn thêm một ý khác ở Option A.')}else{toast('Ý này đã được giữ. Chọn một ý khác ở Option A nhé.')}break}case 'speak-answer':chooseAndSpeak();break;case 'recognize':recognize();break;case 'record':toggleRecord();break;case 'copy-answer':copy($('answer')?.value||'');break;case 'submit':submit();break;case 'restart':state.progress[topic]=0;store();chosenA=0;chosenB=0;pinnedParts=[];render();break;case 'next-topic':{const idx=LESSONS.findIndex(l=>l.id===topic);changeTopic(LESSONS[(idx+1)%LESSONS.length].id);break}case 'open-action':selectedAction=Number(b.dataset.id);paintActionFocus();$('action-focus')?.scrollIntoView({behavior:'smooth',block:'center'});break;case 'close-action':selectedAction=null;paintActionFocus();break;case 'say-action':{const item=ACTIONS.find(x=>x.id===Number(b.dataset.id));if(item)speak(actionVariants(item)[Number(b.dataset.i)]);break}case 'save-action':{const item=ACTIONS.find(x=>x.id===Number(b.dataset.id));if(item){let added=0;for(const v of actionVariants(item)){if(!state.saved.includes(v)){state.saved.push(v);added++}}store();toast(added?'Đã lưu '+added+' câu vào bộ ôn tập.':'Các câu này đã được lưu trước đó.')}break}case 'speak-favorite':speak(state.saved[Number(b.dataset.i)]);break;case 'copy-favorite':copy(state.saved[Number(b.dataset.i)]);break;case 'remove-favorite':{const v=state.saved[Number(b.dataset.i)];state.saved=state.saved.filter(x=>x!==v);store();render();toast('Đã bỏ lưu câu.');break}case 'export':exportData();break;case 'import':$('import-json')?.click();break;case 'reset':{if(confirm('Xóa toàn bộ lượt luyện và tiến độ? Các câu yêu thích cũng sẽ bị xóa. Bạn có thể Xuất dữ liệu trước.')){state=structuredClone(DEFAULT);topic='morning';store();render();toast('Đã đặt lại tiến độ.')};break;}}
}
document.addEventListener('click',handleClick);
document.addEventListener('input',e=>{if(e.target?.id==='action-search'){searchTerm=e.target.value;paintActionResults();}});
document.addEventListener('change',e=>{if(e.target?.id==='group-filter'){groupFilter=e.target.value;paintActionResults()}if(e.target?.id==='import-json')importData(e.target.files?.[0])});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('modal-root').innerHTML='';if((e.ctrlKey||e.metaKey)&&e.key==='Enter'&&view==='practice'){e.preventDefault();submit()}});
document.addEventListener('click',e=>{if(e.target.classList.contains('modal-backdrop'))$('modal-root').innerHTML=''});
$('brand').addEventListener('click',e=>{e.preventDefault();changeView('practice')});
render();
})();

</script>
</body>
